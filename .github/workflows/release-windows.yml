name: Release Windows prototype

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: the-eyes-release-v0.1.0
  cancel-in-progress: false

jobs:
  windows-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.1.0
      GODOT_VERSION: 4.7.2
      GODOT_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      WINDOWS_TEMPLATE_SHA256: d34d36f3be1a6c49c56525ae86469b92e4f417ddf0b43cf00dd80c385c4b0562
      VALIDATED_GAMEPLAY_COMMIT: 6c817877f1e66365655e0245a45570f7484680c8
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve any existing release or tag
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url' \
            > "$RUNNER_TEMP/eyes-existing-release.txt" 2> "$RUNNER_TEMP/eyes-release-check.err"; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; leaving it unchanged. Bump the version for another delivery." >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/eyes-existing-release.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -Eq 'release not found|HTTP 404' "$RUNNER_TEMP/eyes-release-check.err"; then
            cat "$RUNNER_TEMP/eyes-release-check.err" >&2
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/eyes-existing-tag.json" 2> "$RUNNER_TEMP/eyes-tag-check.err"; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Tag $RELEASE_TAG already exists without a readable release; leaving the tag unchanged. Review it and use a new version." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$RUNNER_TEMP/eyes-tag-check.err"; then
            cat "$RUNNER_TEMP/eyes-tag-check.err" >&2
            exit 1
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Require the verified gameplay source
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${VALIDATED_GAMEPLAY_COMMIT}^{commit}"
          git diff --exit-code "$VALIDATED_GAMEPLAY_COMMIT" "$GITHUB_SHA" -- game tools
          echo "Gameplay and build tools match verified commit $VALIDATED_GAMEPLAY_COMMIT." >> "$GITHUB_STEP_SUMMARY"

      - name: Install the pinned and verified Godot editor
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eyes-godot"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/eyes-godot.zip"
          printf '%s  %s\n' "$GODOT_ARCHIVE_SHA256" "$RUNNER_TEMP/eyes-godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/eyes-godot.zip" -d "$RUNNER_TEMP/eyes-godot"
          chmod +x "$RUNNER_TEMP/eyes-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Retrieve matching official Windows templates
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python3 tools/fetch_export_templates.py \
            --version "$GODOT_VERSION" \
            --destination "$RUNNER_TEMP/eyes-templates" \
            --platform windows
          printf '%s  %s\n' "$WINDOWS_TEMPLATE_SHA256" "$RUNNER_TEMP/eyes-templates/windows_release_x86_64.exe" | sha256sum --check

      - name: Export and verify the Windows x64 package
        if: steps.gate.outputs.publish == 'true'
        run: |
          python3 tools/build_windows.py \
            --godot "$RUNNER_TEMP/eyes-godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --template "$RUNNER_TEMP/eyes-templates/windows_release_x86_64.exe" \
            --output "$RUNNER_TEMP/eyes-windows-build"

      - name: Prepare release assets and precise build notes
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eyes-release-assets"
          cp "$RUNNER_TEMP/eyes-windows-build/THE_EYES_v0.1.0_Windows_x64.zip" "$RUNNER_TEMP/eyes-release-assets/"
          (
            cd "$RUNNER_TEMP/eyes-release-assets"
            sha256sum THE_EYES_v0.1.0_Windows_x64.zip > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = Path('docs/releases/V0_1_0.md').read_text(encoding='utf-8')
          server = os.environ['GITHUB_SERVER_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          run = os.environ['GITHUB_RUN_ID']
          notes += (
              '\n\n## Automated build provenance\n\n'
              f'Built from [{sha}]({server}/{repo}/commit/{sha}). '
              f'[Build run]({server}/{repo}/actions/runs/{run}).\n\n'
              'The attached SHA256SUMS.txt is authoritative for this release ZIP. '
              'The archive also contains checksums for its executable and accompanying files.\n'
          )
          (Path(os.environ['RUNNER_TEMP']) / 'eyes-release-notes.md').write_text(notes, encoding='utf-8')
          PY

      - name: Publish the prototype prerelease once
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url' \
            > "$RUNNER_TEMP/eyes-existing-release.txt" 2> "$RUNNER_TEMP/eyes-release-check.err"; then
            echo "Release $RELEASE_TAG was created during this run; leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/eyes-existing-release.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -Eq 'release not found|HTTP 404' "$RUNNER_TEMP/eyes-release-check.err"; then
            cat "$RUNNER_TEMP/eyes-release-check.err" >&2
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/eyes-existing-tag.json" 2> "$RUNNER_TEMP/eyes-tag-check.err"; then
            echo "Tag $RELEASE_TAG was created during this run; leaving it unchanged. Use a new version." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$RUNNER_TEMP/eyes-tag-check.err"; then
            cat "$RUNNER_TEMP/eyes-tag-check.err" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/eyes-release-assets/THE_EYES_v0.1.0_Windows_x64.zip" \
            "$RUNNER_TEMP/eyes-release-assets/SHA256SUMS.txt" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'THE EYES 0.1.0 — The First Observance' \
            --notes-file "$RUNNER_TEMP/eyes-release-notes.md"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
