name: Verify the observance

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the verified Godot version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eyes-godot"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/eyes-godot.zip"
          printf '%s  %s\n' cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 "$RUNNER_TEMP/eyes-godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/eyes-godot.zip" -d "$RUNNER_TEMP/eyes-godot"
          chmod +x "$RUNNER_TEMP/eyes-godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import and verify all six gameplay suites
        shell: bash
        run: |
          python3 - <<'PY'
          import os, runpy
          from pathlib import Path
          helper = runpy.run_path('tools/build_windows.py')
          check = helper['run_checked']
          temporary = Path(os.environ['RUNNER_TEMP'])
          godot = str(temporary / 'eyes-godot' / 'Godot_v4.7.2-stable_linux.x86_64')
          logs_dir = temporary / 'eyes-verification-logs'
          logs_dir.mkdir(exist_ok=True)
          cases = [('import', [godot, '--headless', '--editor', '--path', 'game', '--import'])]
          suites = ['test_director.gd', 'test_world.gd', 'test_survivor_route.gd',
                    'test_trial_set.gd', 'test_second_world.gd', 'test_second_survivor_route.gd']
          for suite in suites:
              cases.append((suite, [godot, '--headless', '--path', 'game', '--fixed-fps', '60',
                                    '--audio-driver', 'Dummy', '--script', f'res://tests/{suite}']))
          for name, command in cases:
              print(f'Running {name}', flush=True)
              logs = []
              try:
                  print(check(command, logs, timeout=600), flush=True)
              finally:
                  (logs_dir / f'{name}.log').write_text('\n'.join(logs), encoding='utf-8')
          PY
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eyes-verification-logs/
          if-no-files-found: warn
          retention-days: 14
