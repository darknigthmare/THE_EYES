name: Verify the observance

on:
  push:
    branches: [main, feat/first-observance]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the verified Godot version
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import the actual project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import
      - name: Match authority
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path game --audio-driver Dummy --script res://tests/test_director.gd
      - name: Physics and physical bot completion
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path game --fixed-fps 60 --audio-driver Dummy --script res://tests/test_world.gd
      - name: Survivor completion against active Eye AI
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path game --fixed-fps 60 --audio-driver Dummy --script res://tests/test_survivor_route.gd

